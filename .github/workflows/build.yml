name: MagicSpoti Automation Engine 🎵

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,18 * * *'

jobs:
  scrape-and-blast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository 📂
        uses: actions/checkout@v4

      - name: Set up Python 3.10 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Utilities (FFmpeg) 🎬
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Arsenal 📦
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp pyTelegramBotAPI

      - name: Run Modular Scraper Engine 👾
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python scripts/pipeline.py
